<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireBase Auth</title>
    <script src="main.js" type="module"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!--Navbar-->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="#">FireApp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item logged-out">
                        <a class="nav-link active" aria-current="page" href="#"
                            data-bs-target="#singin-modal" data-bs-toggle="modal">SingIn</a>
                    </li>
                    <li class="nav-item logged-out">
                        <a class="nav-link" data-bs-target="#singup-modal" data-bs-toggle="modal" href="#">SingUp</a>
                    </li>
                    <li class="nav-item logged-in">
                        <a class="nav-link" href="#" id="logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Modal -->
    <div class="modal fade" id="singin-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">SingIn</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <form id="login-form" action="">
                        <label for="login-email">
                            Email:
                        </label>
                        <input type="email" name="email" id="login-email" placeholder="Email" required
                            class="form-control mb-3">
                        <label for="login-password">
                            Password:
                        </label>
                        <input type="password" name="password" id="login-password" placeholder="******" required
                            class="form-control mb-3">

                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>
                    </form>

                    <button type="button" id="google-login" class="btn btn-info w-100 mt-2  ">
                        Google
                    </button>
                    <button type="button" id="github-login" class="btn btn-dark w-100 mt-2">
                        GitHub
                    </button>
                    <button type="button" id="twitter-login" class="btn btn-secondary w-100 mt-2">
                        X (Twitter)
                    </button>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="singup-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">SingUp</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="singup-form" action="">
                        <label for="email">
                            Email:
                        </label>
                        <input type="email" name="email" id="singup-email" placeholder="Email" required
                            class="form-control mb-3">
                        <label for="password">
                            Password:
                        </label>
                        <input type="password" name="password" id="singup-password" placeholder="******" required
                            class="form-control mb-3">

                        <button type="submit" class="btn btn-primary">
                            SingUp
                        </button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!--Iniciar modal-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
